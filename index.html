<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Novus Gate - Coming Soon">
  <title>Novus Gate | Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.70), rgba(0, 0, 0, 0.78)),
        url('https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=2000&q=85');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 32px 6%;
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 25px 50px;
    }

    .content {
      max-width: 850px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 90px);
      font-weight: 300;
      letter-spacing: 5px;
      margin-bottom: 25px;
    }

    .tagline {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 700;
      margin-bottom: 50px;
    }

    .message {
      font-size: clamp(18px, 2vw, 23px);
      margin-bottom: 28px;
    }

    .keywords {
      font-size: clamp(18px, 2vw, 23px);
      letter-spacing: 1px;
    }

    footer {
      position: absolute;
      bottom: 22px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px;
      }

      .logo {
        font-size: 22px;
      }

      h1 {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NOVUS GATE</div>
  </header>

  <main>
    <div class="content">
      <h1>COMING SOON</h1>

      <div class="tagline">
        The next gate is about to open.
      </div>

      <div class="message">
        Something new is being built.
      </div>

      <div class="keywords">
        Technology. Connection. Possibility.
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 Novus Gate. All rights reserved.
  </footer>

</body>
</html>
